name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        # 3.9 is the floor the scripts promise; the newest catches deprecations early.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - name: Vendored copy works from a product repository
        run: |
          mkdir /tmp/product && python scripts/vendor install /tmp/product > /dev/null
          cd /tmp/product && for s in backlog pr runlog slot-context inbox vendor; do python .claude/product-team/scripts/$s --help > /dev/null; done
          ! grep -rl 'CLAUDE_PLUGIN_ROOT' .claude/agents .claude/skills
      - name: Scripts start
        run: for s in backlog runlog slot-context demo-page inbox sprint-metrics pr vendor workflows; do python scripts/$s --help > /dev/null; done
