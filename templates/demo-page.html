<title>Sprint Demo Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f5f6f8;
    --surface: #ffffff;
    --ink: #17202a;
    --muted: #5b6674;
    --line: #dde2e8;
    --accent: #2f5bd3;
    --accent-ink: #ffffff;
    --good: #1f7a4d;
    --good-bg: #e6f4ec;
    --warn: #9a5b00;
    --warn-bg: #fdf1dc;
    --crit: #b42318;
    --crit-bg: #fdecea;
    --radius: 10px;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --motion-fast: 120ms;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0f141a; --surface: #171e26; --ink: #e6eaf0; --muted: #93a0af; --line: #2a3440;
      --accent: #7ea2ff; --accent-ink: #0f141a;
      --good: #6fd19c; --good-bg: #16301f; --warn: #f0b660; --warn-bg: #33270f; --crit: #ff8a80; --crit-bg: #3a1a18;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0f141a; --surface: #171e26; --ink: #e6eaf0; --muted: #93a0af; --line: #2a3440;
    --accent: #7ea2ff; --accent-ink: #0f141a;
    --good: #6fd19c; --good-bg: #16301f; --warn: #f0b660; --warn-bg: #33270f; --crit: #ff8a80; --crit-bg: #3a1a18;
  }
  @media (prefers-reduced-motion: reduce) { :root { --motion-fast: 0ms; } }

  body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--sans); padding-inline: 16px; padding-block: 20px 96px; }
  main { max-width: 720px; margin: 0 auto; display: grid; gap: 28px; }
  h1, h2 { text-wrap: balance; margin: 0; }
  h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  a { color: var(--accent); }
  .meta { color: var(--muted); font-family: var(--mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  section { display: grid; gap: 12px; }
  .banner { border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px 12px; color: var(--muted); font-size: 0.85rem; }

  .release { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
  .release[data-state="blocked"] { border-color: var(--crit); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font: 500 0.75rem/1 var(--mono); padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.good { color: var(--good); background: var(--good-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.crit { color: var(--crit); background: var(--crit-bg); }
  .pill.plain { color: var(--muted); background: var(--ground); border: 1px solid var(--line); }

  .list { display: grid; gap: 0; border-top: 1px solid var(--line); }
  .item { display: grid; gap: 8px; padding-block: 14px; border-bottom: 1px solid var(--line); }
  .item-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
  .item-title { font-weight: 500; }
  .num { font-family: var(--mono); color: var(--muted); font-size: 0.85rem; }
  .summary { color: var(--muted); margin: 0; max-width: 65ch; }
  .shot { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  .links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.85rem; }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { font: 500 0.9rem var(--sans); min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; transition: background var(--motion-fast), border-color var(--motion-fast); }
  .choice[aria-pressed="true"][data-value="approve"], .choice[aria-pressed="true"][data-value="go"] { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .choice[aria-pressed="true"][data-value="reject"], .choice[aria-pressed="true"][data-value="no-go"] { background: var(--crit-bg); border-color: var(--crit); color: var(--crit); }
  .choice:focus-visible, textarea:focus-visible, .primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 44px; font: 0.9rem/1.4 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
  label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .metric { background: var(--surface); padding: 12px; display: grid; gap: 2px; }
  .metric b { font: 500 1.2rem var(--mono); font-variant-numeric: tabular-nums; }
  .metric span { color: var(--muted); font-size: 0.8rem; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .bar-inner { max-width: 720px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; justify-content: space-between; }
  .status { font-size: 0.85rem; color: var(--muted); }
  .primary { font: 600 0.9rem var(--sans); min-height: 40px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  pre#fallback { font: 0.75rem/1.4 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre; }
</style>

<!-- demo-prep replaces the JSON between the markers; everything else stays as shipped by the plugin. -->
<script type="application/json" id="demo-data">
/*PT-DEMO-DATA-START*/{
  "example": true,
  "product": "storify",
  "repo": "geeera/storify",
  "sprint": "Sprint 01",
  "demo_date": "2026-10-09",
  "stage_url": "https://stage.example.app",
  "demo_issue": { "number": 40, "url": "https://github.com/geeera/storify/issues/40" },
  "release": { "recommendation": "no-go", "auto_no_go": true, "blockers": [ { "number": 37, "title": "Checkout cannot be completed with a keyboard", "url": "https://github.com/geeera/storify/issues/37" } ] },
  "shipped": [
    { "id": "issue-12", "number": 12, "title": "Story editor autosave", "url": "https://github.com/geeera/storify/issues/12", "stage_link": "https://stage.example.app/editor", "summary": "Drafts save every 5 s and after each paragraph; a quiet indicator shows the last save." }
  ],
  "findings": [
    { "number": 37, "title": "Checkout cannot be completed with a keyboard", "severity": "high", "status": "in-progress", "url": "https://github.com/geeera/storify/issues/37" },
    { "number": 38, "title": "Empty library has no call to action", "severity": "medium", "status": "proposed", "url": "https://github.com/geeera/storify/issues/38" }
  ],
  "proposals": [
    { "id": "issue-21", "number": 21, "kind": "feature", "title": "Share a story by link", "url": "https://github.com/geeera/storify/issues/21", "summary": "Read-only public link per story, revocable.", "evidence": "Asked for in 3 of 5 test sessions." },
    { "id": "issue-22", "number": 22, "kind": "wow", "title": "Page-turn transition in the reader", "url": "https://github.com/geeera/storify/issues/22", "summary": "A 240 ms paper-curl on swipe; opacity fade under reduced motion." }
  ],
  "metrics": [
    { "label": "Issues shipped", "value": "7 / 9" },
    { "label": "Median cycle time", "value": "2.4 d" },
    { "label": "Actions minutes", "value": "612 / 2000" }
  ]
}/*PT-DEMO-DATA-END*/
</script>

<main id="app" aria-live="polite"></main>

<div class="bar" role="region" aria-label="Save decisions">
  <div class="bar-inner">
    <span class="status" id="status">Decisions are saved as you tap.</span>
    <button class="primary" id="copy" type="button">Copy decisions for the demo issue</button>
  </div>
</div>

<script>
(() => {
  const raw = document.getElementById("demo-data").textContent;
  const data = JSON.parse(raw.slice(raw.indexOf("/*PT-DEMO-DATA-START*/") + 22, raw.indexOf("/*PT-DEMO-DATA-END*/")));
  const decisions = {};           // id -> {decision, comment}
  let db = null;
  const statusEl = document.getElementById("status");
  const app = document.getElementById("app");

  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) n.append(kid);
    return n;
  };
  const link = (href, text) => href ? el("a", { href, target: "_blank", rel: "noopener", text }) : null;
  const sevClass = { critical: "crit", high: "crit", medium: "warn", low: "plain" };

  function setStatus(text) { statusEl.textContent = text; }

  async function save(id, patch) {
    decisions[id] = Object.assign({ decision: null, comment: "" }, decisions[id], patch);
    if (!db) { setStatus("Not saved online here. Use the copy button and paste into the demo issue."); return; }
    try {
      await db.doc("decisions/" + id).set({ item: id, ...decisions[id], updated_at: new Date().toISOString() });
      setStatus("Saved.");
    } catch (err) {
      const code = err && err.code ? err.code : "error";
      setStatus(code === "not_granted"
        ? "Only the product owner's decisions are saved. Use the copy button instead."
        : "Could not save (" + code + "). Use the copy button and paste into the demo issue.");
    }
  }

  function choiceGroup(id, options, label) {
    const group = el("div", { class: "choices", role: "group", "aria-label": label });
    for (const [value, text] of options) {
      const b = el("button", { type: "button", class: "choice", "data-value": value, "aria-pressed": String(decisions[id]?.decision === value), text });
      b.addEventListener("click", () => {
        const next = decisions[id]?.decision === value ? null : value;
        group.querySelectorAll(".choice").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.value === next)));
        save(id, { decision: next });
      });
      group.append(b);
    }
    return group;
  }

  function commentBox(id, placeholder) {
    const tid = "c-" + id;
    const t = el("textarea", { id: tid, rows: "1", placeholder });
    t.value = decisions[id]?.comment || "";
    let timer;
    t.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => save(id, { comment: t.value.trim() }), 600); });
    return el("div", {}, el("label", { class: "sr", for: tid, text: placeholder }), t);
  }

  function render() {
    app.replaceChildren();
    const r = data.release || {};
    const blocked = (r.blockers || []).length > 0;

    app.append(el("header", { style: "display:grid;gap:6px" },
      el("span", { class: "meta", text: `${data.product} · ${data.sprint} · demo ${data.demo_date}` }),
      el("h1", { text: "What shipped, and what's next" }),
      el("div", { class: "links" }, link(data.stage_url, "Open stage"), link(data.demo_issue?.url, `Demo issue #${data.demo_issue?.number ?? ""}`))
    ));
    if (data.example) app.append(el("p", { class: "banner", text: "Example data. demo-prep replaces it with the real sprint." }));

    const rel = el("section", { class: "release", "data-state": blocked ? "blocked" : "clear", "aria-labelledby": "rel-h" },
      el("h2", { id: "rel-h", text: "Release to production" }),
      el("div", { class: "item-head" },
        el("span", { class: "pill " + (r.recommendation === "go" ? "good" : "crit"), text: "Team: " + (r.recommendation || "no-go") }),
        r.auto_no_go ? el("span", { class: "pill crit", text: "Automatic no-go: blocker in freeze" }) : null)
    );
    if (blocked) {
      const ul = el("div", { class: "list" });
      for (const b of r.blockers) ul.append(el("div", { class: "item" }, el("div", { class: "item-head" }, el("span", { class: "num", text: "#" + b.number }), link(b.url, b.title))));
      rel.append(ul);
    }
    rel.append(choiceGroup("release", [["go", "Go"], ["no-go", "No-go"]], "Release decision"));
    rel.append(commentBox("release", r.auto_no_go ? "Reason, required to override a blocker" : "Comment (optional)"));
    app.append(rel);

    if ((data.shipped || []).length) {
      const list = el("div", { class: "list" });
      for (const s of data.shipped) {
        list.append(el("article", { class: "item" },
          el("div", { class: "item-head" }, el("span", { class: "num", text: "#" + s.number }), el("span", { class: "item-title", text: s.title })),
          s.summary ? el("p", { class: "summary", text: s.summary }) : null,
          s.screenshot ? el("img", { class: "shot", src: s.screenshot, alt: "Screenshot: " + s.title, loading: "lazy" }) : null,
          el("div", { class: "links" }, link(s.stage_link, "Try on stage"), link(s.url, "Issue")),
          commentBox(s.id, "Feedback (optional)")
        ));
      }
      app.append(el("section", { "aria-labelledby": "sh-h" }, el("h2", { id: "sh-h", text: `Shipped to stage (${data.shipped.length})` }), list));
    }

    if ((data.proposals || []).length) {
      const list = el("div", { class: "list" });
      for (const p of data.proposals) {
        list.append(el("article", { class: "item" },
          el("div", { class: "item-head" },
            el("span", { class: "pill " + (p.kind === "wow" ? "warn" : "plain"), text: p.kind === "wow" ? "wow" : "feature" }),
            el("span", { class: "num", text: "#" + p.number }), el("span", { class: "item-title", text: p.title })),
          p.summary ? el("p", { class: "summary", text: p.summary }) : null,
          p.evidence ? el("p", { class: "summary meta", text: p.evidence }) : null,
          choiceGroup(p.id, [["approve", "Approve"], ["reject", "Reject"]], "Decision on " + p.title),
          commentBox(p.id, "Comment (optional)")
        ));
      }
      app.append(el("section", { "aria-labelledby": "pr-h" }, el("h2", { id: "pr-h", text: `Proposed next (${data.proposals.length})` }), list));
    }

    if ((data.findings || []).length) {
      const list = el("div", { class: "list" });
      for (const f of data.findings) {
        list.append(el("div", { class: "item" }, el("div", { class: "item-head" },
          el("span", { class: "pill " + (sevClass[f.severity] || "plain"), text: f.severity }),
          el("span", { class: "num", text: "#" + f.number }), link(f.url, f.title),
          el("span", { class: "meta", text: f.status || "" }))));
      }
      app.append(el("section", { "aria-labelledby": "fi-h" }, el("h2", { id: "fi-h", text: "QA findings" }), list));
    }

    if ((data.metrics || []).length) {
      const grid = el("div", { class: "metrics" });
      for (const m of data.metrics) grid.append(el("div", { class: "metric" }, el("b", { text: m.value }), el("span", { text: m.label })));
      app.append(el("section", { "aria-labelledby": "me-h" }, el("h2", { id: "me-h", text: "Sprint in numbers" }), grid));
    }
  }

  function decisionBlock() {
    const payload = { sprint: data.sprint, decided_at: new Date().toISOString(), decisions };
    return "/demo-decisions\n```json\n" + JSON.stringify(payload, null, 2) + "\n```";
  }

  document.getElementById("copy").addEventListener("click", async () => {
    const text = decisionBlock();
    try {
      await navigator.clipboard.writeText(text);
      setStatus("Copied. Paste it as a comment on the demo issue.");
    } catch (_err) {
      let pre = document.getElementById("fallback");
      if (!pre) { pre = el("pre", { id: "fallback", tabindex: "0" }); app.append(pre); }
      pre.textContent = text;
      const range = document.createRange(); range.selectNodeContents(pre);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      setStatus("Copy was blocked. The text is selected below; copy it by hand.");
    }
  });

  render();

  (async () => {
    db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null;
    if (!db) { setStatus("Saving online is unavailable here. Use the copy button."); return; }
    try {
      const snap = await db.collection("decisions").get();
      snap.docs.forEach(d => { const v = d.data(); if (v) decisions[d.id] = { decision: v.decision ?? null, comment: v.comment ?? "" }; });
      render();
      setStatus("Decisions are saved as you tap.");
    } catch (err) {
      setStatus("Could not load saved decisions (" + (err && err.code ? err.code : "error") + ").");
    }
  })();
})();
</script>
