# .product-team/project.yml — the stack-agnostic contract (reference/stack-contract.md).
# Skills read commands and URLs from here and never guess them.
name: my-product
repo: owner/my-product
mode: new                # new | adopted
# Where the backlog lives: github (GitHub Issues) | console (the team console). The cutover PR sets `console`.
# Security-relevant: `pr gate` reads it from the PR's base branch, so a PR cannot change its own gate. Outside a
# console job, `console` makes `pr gate` / `pr merge` refuse to judge (the gate policy is the owner's, in the
# console); `github` or no key keeps the gate on the `review:` block below.
tracker: github
stack: "TODO: summary — see decision record"
decisions_dir: docs/decisions

commands:
  install: "TODO"
  lint: "TODO"
  test: "TODO"
  build: "TODO"
  e2e: "TODO"            # must honour BASE_URL, e.g. BASE_URL=$STAGE_URL <command>
  storybook: "TODO"      # build command; leave empty for products without a UI

environments:
  dev:
    url: ""
  stage:
    url: ""
  production:
    url: ""

design:
  tokens: []             # token source files
  storybook_url: ""

# On a project whose tracker is the team console (product-team 0.12+), `sprint`, `caps`, `review` and
# `owner.language` are import-only: the owner imports them once in the console (Settings › Team), after which the
# console's team config applies and these copies are documentation. A job warns when they differ ("drift").
sprint:
  length_days: 14
  freeze_days: 2

# Optional overrides of reference/schedule-and-models.md caps, per mode.
caps: {}

# Which independent verdicts a PR needs (reference/workflow.md → Review gate). On GitHub Issues (0.11) `pr gate`
# reads this block from the PR's base branch; on the console it reads the team config and never this block. SECURITY
# is always decided by `pr security-check`. Without this block QA and REVIEW are required on every PR.
review:
  qa: always                 # always | code — QA on every PR (`never` is deprecated: the console drops it and an
                             # import reads it as `code`)
  reviewer: code             # always | code — `code`: only when the PR changes a path in code_paths (`never`:
                             # deprecated, as for qa)
  code_paths: ["apps/**", "libs/**", "packages/**", "src/**"]   # kickoff/adopt set the project's source roots
  max_rework_rounds: 1       # guidance for the orchestrator, not enforced by the gate: after this many rework
                             # rounds only blockers go back; the rest become follow-up issues

team:
  # Release channel the daily self-update follows: `stable` (every release) or a tag such as v0.3.0 (pinned).
  plugin_ref: stable
  # The reviewing identity: the review GitHub App's bot, quoted ('<product>-review[bot]', see
  # reference/identities.md), or a separate reviewing account. Only its verdicts then count in the merge gate, so a
  # developer agent cannot approve its own work. Empty = any account (same-account setup).
  reviewer_logins: []
  # The run-log issue number (`runlog url` creates it; kickoff/adopt write it here). Pinned so an issue someone else
  # opens and labels can never become the log that pauses and resumes the team.
  run_log_issue: 0
  # The team console's GitHub App slugs, one per console environment that writes to this repository (e.g.
  # [team-console-prod]). An owner request to the PM counts only when GitHub says one of these apps posted it
  # (reference/workflow.md → Owner requests). Empty = no request is honoured. Security-relevant: read from the
  # default branch, so it changes only through a merged PR; adding a slug needs the owner's approval.
  console_app_slugs: []

owner:
  timezone: Europe/Kyiv
  language: en           # en | ru — questions, the inbox and the daily digest
