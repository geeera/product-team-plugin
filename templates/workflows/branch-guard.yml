# Branch guard. Private repositories on GitHub's free plan have no branch protection, so the rule
# "every change to dev, stage or main arrives through a pull request" is checked after the fact: a push whose
# head commit belongs to no merged pull request opens a critical, release-blocking issue for the owner.
name: branch-guard

on:
  push:
    branches: [dev, stage, main]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: branch-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check every pushed commit came through a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PUSHER: ${{ github.event.pusher.name }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          # Branch creation has no "before"; the first push of a branch is not a change to guard.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi

          merged_pr() {
            gh api "repos/$REPO/commits/$1/pulls" --jq '[.[] | select(.merged_at != null)] | length'
          }

          if [ "$FORCED" = "true" ]; then
            reason="force-push to \`$BRANCH\` by $PUSHER ($BEFORE → $AFTER)"
          elif [ "$(merged_pr "$AFTER")" -gt 0 ]; then
            exit 0
          else
            reason="\`$BRANCH\` moved to $AFTER by $PUSHER without a merged pull request"
          fi

          body=$(printf '%s\n\n%s\n\n%s\n' \
            "**Branch guard:** $reason." \
            "Compare: https://github.com/$REPO/compare/$BEFORE...$AFTER" \
            "Every change to \`dev\`, \`stage\` and \`main\` must arrive as a pull request. Review the change; if it is wrong, revert it through a pull request. Close this issue once handled.")
          gh issue create -R "$REPO" \
            --title "Branch guard: $BRANCH changed outside a pull request" \
            --label "team:guard" --label "kind:finding" --label "sev:critical" \
            --label "release-blocker" --label "needs:owner" --label "status:blocked" \
            --body "$body"
          echo "::error::$reason"
          exit 1
